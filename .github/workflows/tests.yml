name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Must match the Python version the homeassistant release pinned
          # by requirements_test.txt supports.
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements_test.txt
      - run: pytest
